<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ComfyUI Web Console</title>
<style>
  :root {
    --bg:        #0f1115;
    --panel:     #1a1d24;
    --panel-2:   #21252e;
    --border:    #262a33;
    --text:      #e5e7eb;
    --muted:     #8b91a0;
    --accent:    #3a8bff;
    --green:     #4ade80;
    --amber:     #fbbf24;
    --red:       #f87171;
    --mono:      'SFMono-Regular', Menlo, Monaco, Consolas, 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px;
  }
  a { color: var(--accent); }
  button { font: inherit; }

  /* ---------- header ------------------------------------------------ */
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; flex: 0 0 auto; }
  header .grow { flex: 1 1 auto; }
  header label { color: var(--muted); margin-right: 4px; font-size: 12px; }
  header input, header select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px; font: inherit;
  }
  header input[type=text]     { width: 240px; }
  header input[type=password] { width: 280px; }
  header button {
    background: var(--accent); color: white; border: 0; border-radius: 4px;
    padding: 5px 12px; cursor: pointer;
  }
  header button.ghost {
    background: transparent; color: var(--text); border: 1px solid var(--border);
  }
  header button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- main grid -------------------------------------------- */
  main {
    display: grid;
    grid-template-columns: 1fr 360px;
    grid-template-rows:    1fr;
    height: calc(100vh - 50px);
  }
  .left {
    display: grid;
    grid-template-rows: auto 1fr;   /* input above, history below */
    min-height: 0;                  /* allow inner overflow auto */
  }
  .input    { padding: 12px; border-bottom: 1px solid var(--border); }
  .history  { padding: 12px; overflow: auto; }
  .sidebar  { padding: 12px; border-left: 1px solid var(--border);
              overflow: auto; background: var(--panel); }

  .section h2 {
    margin: 0 0 8px 0; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted); font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .section h2 .grow { flex: 1; }

  /* ---------- workflow editor -------------------------------------- */
  textarea#workflow {
    width: 100%; height: 220px; min-height: 120px; resize: vertical;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 8px; font-family: var(--mono); font-size: 12px;
  }
  .submit-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .submit-row button {
    background: var(--accent); color: white; border: 0; border-radius: 4px;
    padding: 6px 14px; cursor: pointer;
  }
  .submit-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .submit-row label {
    color: var(--muted); font-size: 12px; display: flex;
    align-items: center; gap: 4px;
  }
  .status   { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status.ok   { color: var(--green); }
  .status.warn { color: var(--amber); }
  .status.err  { color: var(--red); }

  /* ---------- history feed ----------------------------------------- */
  .clear-btn {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer;
  }
  .clear-btn:hover { color: var(--text); }
  .entry {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .entry.in-flight { border-color: var(--accent); }
  .entry.failed    { border-color: var(--red); }
  .entry-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 12px;
  }
  .entry-head .id    { color: var(--muted); font-size: 11px; }
  .entry-head .grow  { flex: 1; }
  .entry-head button {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer;
  }
  .entry-head button:hover { background: var(--panel-2); }
  .entry-summary {
    color: var(--muted); font-size: 12px; margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 500; font-family: var(--mono);
  }
  .pill.completed { background: rgba(74, 222, 128, 0.15); color: var(--green); }
  .pill.in-flight { background: rgba(58, 139, 255, 0.15); color: var(--accent); }
  .pill.failed    { background: rgba(248, 113, 113, 0.15); color: var(--red); }

  .outputs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px; margin-top: 10px;
  }
  .outputs .card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
    padding: 6px; display: flex; flex-direction: column; gap: 4px;
  }
  .outputs .card img,
  .outputs .card video,
  .outputs .card audio { width: 100%; border-radius: 2px; max-height: 320px; }
  .outputs .card .meta { font-size: 11px; color: var(--muted); font-family: var(--mono);
                          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .outputs .card a { font-size: 11px; }

  details.raw {
    margin-top: 8px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 8px;
  }
  details.raw summary { cursor: pointer; font-size: 11px; color: var(--muted); }
  details.raw pre {
    font-family: var(--mono); font-size: 11px; margin: 6px 0 0 0; max-height: 280px; overflow: auto;
    color: var(--muted);
  }

  /* ---------- workers panel ---------------------------------------- */
  table.workers {
    width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px;
  }
  table.workers th, table.workers td {
    padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.workers th { color: var(--muted); font-weight: 500;
                     text-transform: uppercase; font-size: 10px; }
  .pill.LOADED      { background: rgba(74, 222, 128, 0.15); color: var(--green); }
  .pill.LOADING     { background: rgba(251, 191, 36, 0.15); color: var(--amber); }
  .pill.UNKNOWN, .pill.ERROR { background: rgba(248, 113, 113, 0.15); color: var(--red); }

  .empty { color: var(--muted); font-style: italic; padding: 16px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>ComfyUI Web Console</h1>
  <label>API key</label>
  <input type="password" id="apiKey" placeholder="VAST_API_KEY" autocomplete="off">
  <label>Endpoint</label>
  <select id="endpointId"><option value="">— pick —</option></select>
  <button id="loadEndpoints" class="ghost">Load endpoints</button>
  <span class="grow"></span>
  <span id="connState" class="status">idle</span>
</header>

<main>
  <section class="left">
    <div class="input section">
      <h2>Workflow payload</h2>
      <textarea id="workflow" spellcheck="false"></textarea>
      <div class="submit-row">
        <button id="submit">Submit /generate/sync</button>
        <label><input type="checkbox" id="base64" checked> request base64 outputs</label>
        <span id="submitState" class="status"></span>
      </div>
    </div>

    <div class="history section">
      <h2>
        Requests
        <span id="historyCount" class="status"></span>
        <span class="grow"></span>
        <button id="clearHistory" class="clear-btn">Clear</button>
      </h2>
      <div id="historyFeed"></div>
      <div id="historyEmpty" class="empty">No requests yet — submit a workflow above.</div>
    </div>
  </section>

  <aside class="sidebar section">
    <h2>
      Workers
      <span class="grow"></span>
      <span id="workersStamp" class="status"></span>
    </h2>
    <table class="workers" id="workersTable">
      <thead><tr><th>id</th><th>status</th><th>load</th><th>perf</th><th>reqs</th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="workersEmpty" class="empty">Pick an endpoint to start polling.</div>
  </aside>
</main>

<script>
const $ = sel => document.querySelector(sel);

// ---- configuration ---------------------------------------------------
// Cap on how many past requests stay rendered. Each entry can hold
// several MB of inline base64 output blobs; eviction explicitly
// revokes their object URLs so the browser can reclaim memory.
const MAX_HISTORY = 20;
const POLL_INTERVAL_MS = 3000;

// ---- persistence: keep the operator's inputs across reloads ---------
const STORAGE_KEY = 'vast.comfyui_web_console.v1';
const saveState = () => {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    apiKey:     $('#apiKey').value,
    endpointId: $('#endpointId').value,
    workflow:   $('#workflow').value,
    base64:     $('#base64').checked,
  }));
};
const loadState = () => {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (s.apiKey)   $('#apiKey').value   = s.apiKey;
    if (s.workflow) $('#workflow').value = s.workflow;
    if (s.base64 !== undefined) $('#base64').checked = !!s.base64;
    return s.endpointId || '';
  } catch { return ''; }
};
['apiKey', 'workflow', 'base64'].forEach(id => {
  document.getElementById(id).addEventListener('input', saveState);
  document.getElementById(id).addEventListener('change', saveState);
});

if (!$('#workflow').value) {
  $('#workflow').value = JSON.stringify({
    "input": {
      "modifier": "Text2Image",
      "modifications": {
        "prompt": "a cat on a windowsill at sunset",
        "width": 512, "height": 512, "steps": 20, "seed": 42
      }
    }
  }, null, 2);
}

// ---- helpers ----------------------------------------------------------
const setConn   = (msg, cls = '')  => { const el = $('#connState');   el.textContent = msg; el.className = 'status ' + cls; };
const setSubmit = (msg, cls = '')  => { const el = $('#submitState'); el.textContent = msg; el.className = 'status ' + cls; };

async function postJSON(url, body) {
  const resp = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    const text = await resp.text();
    throw new Error(`${resp.status}: ${text}`);
  }
  return resp.json();
}

// MIME inference from filename. Conservative fallback so the browser
// at least gets a download link for unknown types.
const EXT_MIME = {
  png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif',
  webp: 'image/webp', avif: 'image/avif',
  mp4: 'video/mp4', webm: 'video/webm', mov: 'video/quicktime',
  mkv: 'video/x-matroska', m4v: 'video/x-m4v',
  mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg', flac: 'audio/flac',
  m4a: 'audio/mp4', aac: 'audio/aac',
};
function mimeFor(filename) {
  const ext = (String(filename || '').split('.').pop() || '').toLowerCase();
  return EXT_MIME[ext] || '';
}

// Convert a base64 payload into a Blob and an object URL. The browser
// holds blobs as raw binary rather than re-decoding a multi-MB data:
// URI on every layout pass, and we can free them with revokeObjectURL.
function base64ToBlobUrl(b64, mime) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr], { type: mime || 'application/octet-stream' }));
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ---- endpoint listing -------------------------------------------------
$('#loadEndpoints').addEventListener('click', async () => {
  const apiKey = $('#apiKey').value.trim();
  if (!apiKey) { setConn('enter an API key first', 'warn'); return; }
  try {
    setConn('loading endpoints…');
    const eps = await postJSON('/api/endpoints', { api_key: apiKey });
    const sel = $('#endpointId');
    sel.innerHTML = '<option value="">— pick —</option>';
    for (const e of eps) {
      const opt = document.createElement('option');
      opt.value = e.id;
      opt.textContent = `${e.name} (id=${e.id})`;
      sel.appendChild(opt);
    }
    setConn(`${eps.length} endpoint(s)`, 'ok');
    const wanted = loadState();
    if (wanted && [...sel.options].some(o => o.value == wanted)) {
      sel.value = wanted;
      sel.dispatchEvent(new Event('change'));
    }
  } catch (err) {
    setConn(`error: ${err.message}`, 'err');
  }
});

$('#endpointId').addEventListener('change', () => {
  saveState();
  startWorkerPolling();
});

// ---- worker polling ---------------------------------------------------
let pollTimer = null;
async function pollOnce() {
  const apiKey = $('#apiKey').value.trim();
  const epId   = $('#endpointId').value;
  if (!apiKey || !epId) return;
  try {
    const workers = await postJSON('/api/workers', {
      api_key: apiKey, endpoint_id: parseInt(epId, 10),
    });
    renderWorkers(workers);
    $('#workersStamp').textContent = new Date().toLocaleTimeString();
    $('#workersStamp').className = 'status ok';
  } catch (err) {
    $('#workersStamp').textContent = `error: ${err.message.slice(0, 60)}`;
    $('#workersStamp').className = 'status err';
  }
}

function renderWorkers(workers) {
  const tbody = $('#workersTable tbody');
  tbody.innerHTML = '';
  $('#workersEmpty').style.display = workers.length ? 'none' : 'block';
  for (const w of workers) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${w.id}</td>
      <td><span class="pill ${escapeHtml(w.status)}">${escapeHtml(w.status)}</span></td>
      <td>${w.cur_load.toFixed(2)}</td>
      <td>${(w.measured_perf || w.cur_perf || w.perf || 0).toFixed(2)}</td>
      <td>${w.reqs_working}</td>
    `;
    tbody.appendChild(tr);
  }
}

function startWorkerPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollOnce();
  pollTimer = setInterval(pollOnce, POLL_INTERVAL_MS);
}

// ---- history feed -----------------------------------------------------
//
// Each entry is an object owning its own DOM element. New entries go
// to the front of the list; when we exceed MAX_HISTORY the oldest is
// evicted, its object URLs revoked, and its element detached. This
// keeps memory bounded even when batches return many MB of base64
// data per request.

let nextId = 1;
const history = [];

function pushEntry(entry) {
  history.unshift(entry);
  while (history.length > MAX_HISTORY) {
    revokeEntry(history.pop());
  }
  renderHistory();
}

function revokeEntry(entry) {
  if (!entry) return;
  for (const url of entry.blobUrls || []) {
    try { URL.revokeObjectURL(url); } catch {}
  }
  entry.blobUrls = [];
  if (entry.element && entry.element.parentNode) {
    entry.element.parentNode.removeChild(entry.element);
  }
}

function renderHistory() {
  const feed = $('#historyFeed');
  feed.innerHTML = '';
  for (const entry of history) feed.appendChild(entry.element);
  $('#historyEmpty').style.display = history.length ? 'none' : 'block';
  $('#historyCount').textContent = history.length
    ? `${history.length}/${MAX_HISTORY}`
    : '';
}

$('#clearHistory').addEventListener('click', () => {
  while (history.length) revokeEntry(history.pop());
  renderHistory();
});

function entryCard(entry) {
  const card = document.createElement('div');
  card.className = 'entry ' + entry.status;

  const head = document.createElement('div');
  head.className = 'entry-head';
  head.innerHTML = `
    <span class="pill ${entry.status}">${entry.status}</span>
    <span>${entry.ts.toLocaleTimeString()}</span>
    <span class="id">#${entry.id}</span>
    <span class="duration"></span>
    <span class="grow"></span>
    <button class="reload" title="Load this payload back into the editor">Reload workflow</button>
  `;
  head.querySelector('.reload').addEventListener('click', () => {
    $('#workflow').value = JSON.stringify(entry.payload, null, 2);
    saveState();
    $('#workflow').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  card.appendChild(head);

  const summary = document.createElement('div');
  summary.className = 'entry-summary';
  summary.textContent = summarisePayload(entry.payload);
  card.appendChild(summary);

  const outputsEl = document.createElement('div');
  outputsEl.className = 'outputs';
  card.appendChild(outputsEl);

  const raw = document.createElement('details');
  raw.className = 'raw';
  raw.innerHTML = `<summary>Raw payload &amp; response</summary><pre></pre>`;
  card.appendChild(raw);

  entry.element   = card;
  entry._head     = head;
  entry._outputs  = outputsEl;
  entry._raw      = raw.querySelector('pre');
  entry._duration = head.querySelector('.duration');
  return card;
}

function updateEntry(entry) {
  entry.element.className = 'entry ' + entry.status;
  const pill = entry._head.querySelector('.pill');
  pill.className   = 'pill ' + entry.status;
  pill.textContent = entry.status;
  entry._duration.textContent = entry.duration != null
    ? `· ${entry.duration.toFixed(1)}s` : '';

  entry._outputs.innerHTML = '';
  const outputs = extractOutputs(entry.response);
  for (const item of outputs) {
    entry._outputs.appendChild(renderOutput(item, entry.blobUrls));
  }
  if (entry.error) {
    const err = document.createElement('div');
    err.className = 'status err';
    err.style.fontFamily = 'var(--mono)';
    err.style.marginTop  = '6px';
    err.textContent = entry.error;
    entry._outputs.appendChild(err);
  }

  entry._raw.textContent = JSON.stringify({
    payload:  entry.payload,
    response: entry.response,
    error:    entry.error,
  }, null, 2);
}

function summarisePayload(payload) {
  // Best-effort: pull the prompt out of modifier mode, fall back to
  // truncated JSON for raw workflows.
  const p = payload?.input?.modifications?.prompt;
  if (typeof p === 'string') return p.length > 140 ? p.slice(0, 137) + '…' : p;
  const s = JSON.stringify(payload);
  return s.length > 140 ? s.slice(0, 137) + '…' : s;
}

function extractOutputs(response) {
  // Tolerate both the standard Vast wrapper shape and direct shapes.
  return (response?.response?.output) || (response?.output) || [];
}

function renderOutput(item, blobUrls) {
  const card = document.createElement('div');
  card.className = 'card';

  const filename = item.filename || item.name || '(unnamed)';
  const mime     = mimeFor(filename);
  let src = null;
  if (item.data) {
    src = base64ToBlobUrl(item.data, mime);
    blobUrls.push(src);
  } else if (item.url) {
    src = item.url;
  }

  if (src) {
    let media;
    if      (mime.startsWith('image/')) media = Object.assign(document.createElement('img'),   { src });
    else if (mime.startsWith('video/')) media = Object.assign(document.createElement('video'), { src, controls: true });
    else if (mime.startsWith('audio/')) media = Object.assign(document.createElement('audio'), { src, controls: true });
    else                                media = Object.assign(document.createElement('a'),     { href: src, textContent: 'download', target: '_blank' });
    card.appendChild(media);
  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = filename;
  card.appendChild(meta);

  if (item.url && item.data) {
    const a = document.createElement('a');
    a.href = item.url; a.target = '_blank'; a.textContent = 'open S3 url';
    card.appendChild(a);
  }
  return card;
}

// ---- submit -----------------------------------------------------------
$('#submit').addEventListener('click', async () => {
  const apiKey = $('#apiKey').value.trim();
  const epId   = $('#endpointId').value;
  if (!apiKey || !epId) { setSubmit('pick an endpoint first', 'warn'); return; }

  let payload;
  try { payload = JSON.parse($('#workflow').value); }
  catch (e) { setSubmit(`invalid JSON: ${e.message}`, 'err'); return; }

  if ($('#base64').checked) {
    payload.input = payload.input || {};
    payload.input.return_outputs_as_base64 = true;
  }

  // Snapshot a deep copy so future edits to the textarea don't
  // mutate this entry's recorded payload.
  const snapshot = JSON.parse(JSON.stringify(payload));

  const entry = {
    id:       nextId++,
    ts:       new Date(),
    payload:  snapshot,
    status:   'in-flight',
    duration: null,
    response: null,
    error:    null,
    blobUrls: [],
  };
  entryCard(entry);
  updateEntry(entry);
  pushEntry(entry);

  $('#submit').disabled = true;
  setSubmit('submitting…');
  const t0 = Date.now();
  try {
    const data = await postJSON('/api/submit', {
      api_key: apiKey, endpoint_id: parseInt(epId, 10), payload,
    });
    entry.duration = (Date.now() - t0) / 1000;
    entry.response = data.response;
    entry.status   = 'completed';
    setSubmit(`completed in ${entry.duration.toFixed(1)}s`, 'ok');
  } catch (err) {
    entry.duration = (Date.now() - t0) / 1000;
    entry.error    = err.message;
    entry.status   = 'failed';
    setSubmit(`error: ${err.message}`, 'err');
  } finally {
    updateEntry(entry);
    $('#submit').disabled = false;
  }
});

// ---- bootstrap --------------------------------------------------------
loadState();
renderHistory();
</script>
</body>
</html>
